name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (C++20)
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - name: Linux Clang (C++20)
            c_compiler: clang-17
            cpp_compiler: clang++-17

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgmock-dev ${{ matrix.c_compiler }} ${{ matrix.cpp_compiler }}

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Build All Targets
        run: cmake --build build --config Release

      - name: Run Test Suite (191 Tests)
        run: ctest --test-dir build --output-on-failure --verbose

  build-windows:
    name: Windows MSYS2 UCRT64 (C++20)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtest

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build All Targets
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Run Test Suite (191 Tests)
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

  sanitizers-and-valgrind:
    name: Linux ThreadSanitizer & Helgrind
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgmock-dev clang-17 valgrind

      - name: Configure CMake with ThreadSanitizer (TSan)
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DENABLE_TSAN=ON

      - name: Build Targets under TSan
        run: cmake --build build-tsan

      - name: Reduce ASLR entropy for TSan compatibility
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Run All Tests under ThreadSanitizer (TSan)
        run: ctest --test-dir build-tsan --output-on-failure --verbose
        env:
          TSAN_OPTIONS: "halt_on_error=1 abort_on_error=1 second_deadlock_stack=1"

      - name: Configure CMake for Helgrind
        run: |
          cmake -B build-valgrind -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_FLAGS="-gdwarf-4" \
            -DCMAKE_CXX_FLAGS="-gdwarf-4"

      - name: Build BPM Concurrent Test for Helgrind
        run: cmake --build build-valgrind --target buffer_pool_manager_concurrent_test

      - name: Run Concurrent Stress Test under Valgrind Helgrind
        run: |
          valgrind --tool=helgrind --error-exitcode=1 -s --read-var-info=yes --track-lockorders=yes --suppressions=helgrind.supp ./build-valgrind/buffer_pool_manager_concurrent_test
